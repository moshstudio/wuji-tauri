[package]
name = "tauri-plugin-cast"
version = "0.1.0"
authors = [ "You" ]
description = "DLNA cast plugin for Android"
edition = "2021"
rust-version = "1.77.2"
exclude = [
  "/examples",
  "/node_modules"
]
links = "tauri-plugin-cast"

[dependencies]
tauri = { version = "2.1.0" }
serde = { version = "1.0", features = [ "derive" ] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.0.2", features = [ "build" ] }
